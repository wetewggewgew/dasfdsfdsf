<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Для ярлыка на телефоне фон нужен: система обрезает иконку по своей форме.
       Знак вписан в безопасную зону — 80% поля. -->
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256 256) scale(4.4)" fill="none" stroke="#c96442" stroke-linecap="round">
    <circle r="17" stroke-width="13" stroke-dasharray="72 34" transform="rotate(-100)"/>
    <circle r="32" stroke-width="11" stroke-dasharray="113 88" transform="rotate(-70)" opacity="0.82"/>
  </g>
  <circle cx="256" cy="256" r="40" fill="#c96442"/>
</svg>
